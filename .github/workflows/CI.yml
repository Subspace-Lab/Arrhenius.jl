name: Native Julia tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Julia 1.12 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
          arch: default
      - name: Instantiate and test
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  python-gates:
    name: Python cross-residual report gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test report gates without solver dependencies
        run: python3 -m unittest discover -s test/cantera_parity -p 'test_xresid_gates.py' -v
