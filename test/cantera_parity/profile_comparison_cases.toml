rtol = 1e-7
atol = 1e-12
xtol = 1e-5

[[cases]]
name = "identical"
reference = [[0, 1], [1, 2], [2, 3]]
sample = [[0, 1], [1, 2], [2, 3]]
passes = true

[[cases]]
name = "different linear grid"
reference = [[0, 0], [0.5, 0.5], [1, 1], [2, 2]]
sample = [[0, 0], [1, 1], [2, 2]]
passes = true

[[cases]]
name = "endpoint clamping"
reference = [[0, 1], [1, 1], [2, 1]]
sample = [[0.5, 1], [1.5, 1]]
passes = true

[[cases]]
name = "slope permits small shift"
reference = [[0, 0], [1, 1], [2, 2]]
sample = [[0, 0], [1, 1.000001], [2, 2.000001]]
passes = true

[[cases]]
name = "exceeded all three thresholds"
reference = [[0, 1], [1, 1], [2, 1]]
sample = [[0, 2], [1, 2], [2, 2]]
passes = false
